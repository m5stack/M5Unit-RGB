; ================================
; UnitNeco (WS2812, Unit)
; ================================
; --------------------------------
; UnitTest
; --------------------------------
; Neco: Core routes port_b_in to GPIO 36 (input-only, no internal pull-up),
; so buttonAvailable()==false and TestUnitNeco.Button is reported as SKIPPED.
[env:test_UnitNeco_Core]
extends=Core, option_release, arduino_latest
lib_deps = ${Core.lib_deps}
  ${test_fw.lib_deps}
test_filter= embedded/test_unit_neco

